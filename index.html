<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grofadora industrial de película</title>
  <style>
    body { margin: 0; overflow: hidden; background: #f1f0ed; font-family: Arial, sans-serif; }
    #panel {
      position: absolute; top: 16px; left: 16px; z-index: 1;
      padding: 14px; background: #ffffffdd; border-radius: 10px;
      box-shadow: 0 2px 12px #0002;
    }
    button { padding: 9px 14px; cursor: pointer; }
    #estado { margin-top: 8px; font-size: 13px; color: #333; }
    #ayuda { font-size: 12px; color: #555; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="panel">
    <strong>Grofadora industrial de película</strong><br><br>
    <button id="boton">Repetir montaje</button>
    <div id="estado" role="status" aria-live="polite">Montando las piezas…</div>
    <div id="ayuda">Arrastra para orbitar 360°; usa la rueda para zoom.</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf1f0ed);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(14, 10, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enableRotate = true;
    controls.minPolarAngle = 0.001;
    controls.maxPolarAngle = Math.PI - 0.001;
    controls.target.set(0, 2, 0);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2));
    const light = new THREE.DirectionalLight(0xffffff, 3);
    light.position.set(4, 8, 6);
    light.castShadow = true;
    light.shadow.mapSize.set(2048, 2048);
    light.shadow.camera.left = -7;
    light.shadow.camera.right = 7;
    light.shadow.camera.top = 7;
    light.shadow.camera.bottom = -7;
    light.shadow.bias = -0.00015;
    scene.add(light);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0xf1f0ed, roughness: 1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -2.2;
    floor.receiveShadow = true;
    scene.add(floor);

    const machine = new THREE.Group();
    // Pone el eje del rodillo en horizontal, como en la operación real.
    machine.rotation.z = Math.PI / 2;
    machine.position.y = 5;
    scene.add(machine);

    const assembly = new THREE.Group();
    machine.add(assembly);

    const metal = new THREE.MeshStandardMaterial({
      color: 0x9ba2a7, metalness: 0.55, roughness: 0.26
    });
    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x42494e, metalness: 0.65, roughness: 0.28
    });
    const gold = new THREE.MeshStandardMaterial({
      color: 0xd5a329, metalness: 0.68, roughness: 0.25
    });
    const sleeveMetal = new THREE.MeshStandardMaterial({
      color: 0x7f888e, metalness: 0.72, roughness: 0.24,
      side: THREE.DoubleSide
    });
    const sleeveInnerMetal = new THREE.MeshStandardMaterial({
      color: 0x343b40, metalness: 0.68, roughness: 0.3,
      side: THREE.DoubleSide
    });
    const blue = new THREE.MeshStandardMaterial({
      color: 0x1765b4, metalness: 0.48, roughness: 0.24,
      side: THREE.DoubleSide
    });
    const darkBlue = new THREE.MeshStandardMaterial({
      color: 0x103f73, metalness: 0.4, roughness: 0.34,
      side: THREE.DoubleSide
    });
    const motorCasing = new THREE.MeshStandardMaterial({
      color: 0x174c69, metalness: 0.38, roughness: 0.32
    });
    const motorDark = new THREE.MeshStandardMaterial({
      color: 0x202a30, metalness: 0.58, roughness: 0.3
    });
    const starterRed = new THREE.MeshStandardMaterial({ color: 0xc84434, roughness: 0.35 });
    const starterGreen = new THREE.MeshStandardMaterial({ color: 0x39a85a, roughness: 0.35 });

    function verticalCylinder(radius, length, material, y, x = 0, segments = 64) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, segments),
        material
      );
      mesh.position.set(x, y, 0);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      assembly.add(mesh);
      return mesh;
    }

    // Cuerpo del rodillo y eje inferior angosto para montar las piezas.
    const bodyLength = 5.0;
    const bodyRadius = 0.72;
    const barRadius = 0.38;
    const boreRadius = 0.415;
    const outerRadius = bodyRadius;
    verticalCylinder(bodyRadius, bodyLength, metal, 0, 0, 96);
    verticalCylinder(barRadius, 0.55, darkMetal, 2.775);
    verticalCylinder(0.13, 2.7, darkMetal, 4.4);
    verticalCylinder(barRadius, 2.28, darkMetal, -3.64);
    verticalCylinder(0.13, 0.9, darkMetal, -5.23);

    // Estrías de ajuste visibles en los tramos expuestos del eje inferior.
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      const rail = verticalCylinder(0.014, 2.28, gold, -3.64, 0, 32);
      rail.position.x = 0.392 * Math.cos(a);
      rail.position.z = 0.392 * Math.sin(a);
    }

    // Camisa sujetadora hueca.
    const sleeve = new THREE.Group();
    assembly.add(sleeve);
    sleeve.visible = false;

    const sleeveLength = 1.64;
    const ringWidth = 0.64;
    const ringCenterY = -(bodyLength / 2 + ringWidth / 2);
    const sleeveCenterY = -(bodyLength / 2 + ringWidth + sleeveLength / 2);
    const markingTrackX = -ringCenterY;
    const shaftEndY = -5.68;
    const ringStartY = shaftEndY - ringWidth / 2;
    const sleeveStartY = ringStartY - (ringWidth + sleeveLength) / 2;
    const sleeveOuter = new THREE.Mesh(
      new THREE.CylinderGeometry(outerRadius, outerRadius, sleeveLength, 96, 1, true), sleeveMetal
    );
    sleeveOuter.castShadow = true;
    sleeve.add(sleeveOuter);

    const sleeveInner = new THREE.Mesh(
      new THREE.CylinderGeometry(boreRadius, boreRadius, sleeveLength, 96, 1, true), sleeveInnerMetal
    );
    sleeve.add(sleeveInner);

    // Caras y rebordes mecanizados que dejan visible el espesor de la camisa.
    for (const x of [-sleeveLength / 2, sleeveLength / 2]) {
      const lip = new THREE.Mesh(
        new THREE.RingGeometry(boreRadius, outerRadius, 96), sleeveMetal
      );
      lip.rotation.x = Math.PI / 2;
      lip.position.y = x;
      sleeve.add(lip);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(outerRadius - 0.012, 0.012, 10, 96), sleeveInnerMetal
      );
      rim.rotation.x = Math.PI / 2;
      rim.position.y = x;
      sleeve.add(rim);
    }
    sleeve.position.set(0, sleeveStartY, 0);

    // Anillo de marcación hueco.
    const ring = new THREE.Group();
    assembly.add(ring);
    ring.visible = false;

    const markingCanvas = document.createElement('canvas');
    markingCanvas.width = 1024;
    markingCanvas.height = 256;
    const markingContext = markingCanvas.getContext('2d');
    if (!markingContext) {
      throw new Error('No se pudo crear la textura del grabado ANLA.');
    }
    const markingGradient = markingContext.createLinearGradient(0, 0, 0, markingCanvas.height);
    markingGradient.addColorStop(0, '#1b6bb7');
    markingGradient.addColorStop(0.5, '#125293');
    markingGradient.addColorStop(1, '#1b6bb7');
    markingContext.fillStyle = markingGradient;
    markingContext.fillRect(0, 0, markingCanvas.width, markingCanvas.height);
    markingContext.textAlign = 'center';
    markingContext.textBaseline = 'middle';
    markingContext.font = 'bold 160px Arial, sans-serif';
    markingContext.lineJoin = 'round';
    for (const x of [128, 640]) {
      markingContext.fillStyle = 'rgba(126, 177, 229, 0.72)';
      markingContext.fillText('ANLA', x, 116);
      markingContext.fillStyle = '#08294e';
      markingContext.fillText('ANLA', x, 140);
    }
    const markingTexture = new THREE.CanvasTexture(markingCanvas);
    markingTexture.colorSpace = THREE.SRGBColorSpace;
    const engravedBlue = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: markingTexture,
      metalness: 0.48,
      roughness: 0.3,
      side: THREE.DoubleSide
    });
    const ringOuter = new THREE.Mesh(
      new THREE.CylinderGeometry(outerRadius, outerRadius, ringWidth, 128, 1, true), engravedBlue
    );
    ringOuter.castShadow = true;
    ring.add(ringOuter);

    const ringInner = new THREE.Mesh(
      new THREE.CylinderGeometry(boreRadius, boreRadius, ringWidth, 96, 1, true), darkBlue
    );
    ring.add(ringInner);

    for (const x of [-ringWidth / 2, ringWidth / 2]) {
      const face = new THREE.Mesh(
        new THREE.RingGeometry(boreRadius, outerRadius, 96), blue
      );
      face.rotation.x = Math.PI / 2;
      face.position.y = x;
      ring.add(face);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(outerRadius - 0.012, 0.012, 10, 96), darkBlue
      );
      rim.rotation.x = Math.PI / 2;
      rim.position.y = x;
      ring.add(rim);
    }
    ring.position.set(0, ringStartY, 0);

    const pressureRoller = new THREE.Group();
    pressureRoller.position.set(-(2 * outerRadius + 0.012), -(ringWidth + sleeveLength) / 2, 0);
    pressureRoller.position.z = 2.4;
    pressureRoller.visible = false;
    machine.add(pressureRoller);
    const pressureLength = bodyLength + ringWidth + sleeveLength;
    const pressureBody = new THREE.Mesh(
      new THREE.CylinderGeometry(outerRadius, outerRadius, pressureLength, 96), metal
    );
    pressureBody.castShadow = true;
    pressureBody.receiveShadow = true;
    pressureRoller.add(pressureBody);
    const pressureAxleLength = 0.9;
    for (const end of [-1, 1]) {
      const axle = new THREE.Mesh(
        new THREE.CylinderGeometry(0.13, 0.13, pressureAxleLength, 64), darkMetal
      );
      axle.position.y = end * (pressureLength / 2 + pressureAxleLength / 2);
      axle.castShadow = true;
      pressureRoller.add(axle);
    }

    const bearingSystem = new THREE.Group();
    bearingSystem.position.z = 2.2;
    bearingSystem.visible = false;
    machine.add(bearingSystem);
    const bearingMetal = new THREE.MeshStandardMaterial({
      color: 0x92999e, metalness: 0.72, roughness: 0.24
    });

    function frameBox(size, position, material = metal) {
      const box = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
      box.position.set(...position);
      box.castShadow = true;
      box.receiveShadow = true;
      bearingSystem.add(box);
      return box;
    }

    const frameRailX = -2.1;
    const frameRailZ = 0.68;
    const frameRailLength = 13;
    for (const side of [-1, 1]) {
      frameBox(
        [0.18, frameRailLength, 0.18],
        [frameRailX, 0.75, side * frameRailZ],
        bearingMetal
      );
    }
    for (const end of [-1, 1]) {
      frameBox(
        [0.18, 0.18, 1.54],
        [frameRailX, end < 0 ? -5.75 : 7.25, 0],
        bearingMetal
      );
    }

    function addBearingSupport(radialCenter, axialCenter) {
      const support = new THREE.Group();
      support.position.set(radialCenter, axialCenter, 0);
      bearingSystem.add(support);

      const raceWidth = 0.36;
      const raceOuter = new THREE.Mesh(
        new THREE.CylinderGeometry(0.34, 0.34, raceWidth, 64, 1, true), bearingMetal
      );
      raceOuter.castShadow = true;
      support.add(raceOuter);

      const raceInner = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.16, raceWidth, 64, 1, true), darkMetal
      );
      support.add(raceInner);

      for (const end of [-1, 1]) {
        const face = new THREE.Mesh(
          new THREE.RingGeometry(0.16, 0.34, 64), bearingMetal
        );
        face.rotation.x = Math.PI / 2;
        face.position.y = end * raceWidth / 2;
        support.add(face);
      }

      for (const side of [-1, 1]) {
        const upright = new THREE.Mesh(
          new THREE.BoxGeometry(0.14, 0.42, 1.08), bearingMetal
        );
        upright.position.x = side * 0.47;
        support.add(upright);

        const crossbar = new THREE.Mesh(
          new THREE.BoxGeometry(0.82, 0.42, 0.14), bearingMetal
        );
        crossbar.position.z = side * 0.47;
        support.add(crossbar);
      }

      const supportBottom = radialCenter - 0.54;
      const railTop = frameRailX + 0.09;
      const legLength = Math.max(0, supportBottom - railTop);
      if (legLength > 0) {
        for (const side of [-1, 1]) {
          const leg = new THREE.Mesh(
            new THREE.BoxGeometry(legLength, 0.2, 0.16), bearingMetal
          );
          leg.position.set(
            (supportBottom + railTop) / 2,
            axialCenter,
            side * 0.47
          );
          bearingSystem.add(leg);
        }
      }
    }

    addBearingSupport(0, 5.25);
    addBearingSupport(0, -5.23);
    addBearingSupport(
      pressureRoller.position.x,
      pressureRoller.position.y + pressureLength / 2 + pressureAxleLength / 2
    );
    addBearingSupport(
      pressureRoller.position.x,
      pressureRoller.position.y - pressureLength / 2 - pressureAxleLength / 2
    );

    const driveSystem = new THREE.Group();
    driveSystem.position.y = 8.5;
    driveSystem.visible = false;
    machine.add(driveSystem);
    const motorBodyLength = 1.4;
    const motorBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.42, 0.42, motorBodyLength, 64), motorCasing
    );
    motorBody.castShadow = true;
    driveSystem.add(motorBody);
    for (const y of [-0.48, -0.24, 0, 0.24, 0.48]) {
      const fin = new THREE.Mesh(
        new THREE.CylinderGeometry(0.46, 0.46, 0.07, 64), motorDark
      );
      fin.position.y = y;
      driveSystem.add(fin);
    }
    for (const end of [-1, 1]) {
      const cap = new THREE.Mesh(
        new THREE.CylinderGeometry(0.43, 0.43, 0.12, 64), motorDark
      );
      cap.position.y = end * (motorBodyLength / 2 + 0.04);
      driveSystem.add(cap);
    }
    const coupling = new THREE.Mesh(
      new THREE.CylinderGeometry(0.22, 0.22, 0.34, 48), darkMetal
    );
    coupling.position.y = -0.86;
    driveSystem.add(coupling);
    const motorMount = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 1.5, 0.82), bearingMetal
    );
    motorMount.position.set(-1.25, 0, 0);
    driveSystem.add(motorMount);
    const starterBox = new THREE.Mesh(
      new THREE.BoxGeometry(0.48, 0.52, 0.4), motorCasing
    );
    starterBox.position.set(0.5, 0.12, 0);
    driveSystem.add(starterBox);
    const starterButton = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.1, 0.1, 32), starterRed
    );
    starterButton.rotation.z = Math.PI / 2;
    starterButton.position.set(0.8, 0.12, 0);
    driveSystem.add(starterButton);
    const runningButton = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.1, 0.1, 32), starterGreen
    );
    runningButton.rotation.z = Math.PI / 2;
    runningButton.position.copy(starterButton.position);
    runningButton.visible = false;
    driveSystem.add(runningButton);

    const filmCanvas = document.createElement('canvas');
    filmCanvas.width = 512;
    filmCanvas.height = 128;
    const filmContext = filmCanvas.getContext('2d');
    if (!filmContext) {
      throw new Error('No se pudo crear la textura de la película.');
    }
    filmContext.fillStyle = 'rgba(74, 190, 218, 0.76)';
    filmContext.fillRect(0, 0, filmCanvas.width, filmCanvas.height);
    filmContext.textAlign = 'center';
    filmContext.textBaseline = 'middle';
    filmContext.font = 'bold 24px Arial, sans-serif';
    filmContext.fillStyle = 'rgba(8, 41, 78, 0.9)';
    const filmLength = 9.4;
    const filmWidth = pressureLength - 0.12;
    const filmCenterX = -pressureRoller.position.y;
    const imprintX = ((markingTrackX - filmCenterX + filmWidth / 2) / filmWidth) * filmCanvas.width;
    filmContext.save();
    filmContext.translate(imprintX, filmCanvas.height / 2);
    filmContext.rotate(Math.PI / 2);
    filmContext.fillText('ANLA', 0, 0);
    filmContext.restore();
    const rollerAngularSpeed = 1.4;
    const filmTexture = new THREE.CanvasTexture(filmCanvas);
    filmTexture.colorSpace = THREE.SRGBColorSpace;
    filmTexture.wrapT = THREE.RepeatWrapping;
    filmTexture.repeat.y = filmLength / (Math.PI * outerRadius);
    const film = new THREE.Mesh(
      new THREE.PlaneGeometry(filmWidth, filmLength),
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: filmTexture,
        transparent: true,
        opacity: 0.7,
        roughness: 0.3,
        side: THREE.DoubleSide,
        depthWrite: false
      })
    );
    film.rotation.x = -Math.PI / 2;
    film.position.set(filmCenterX, machine.position.y - outerRadius - 0.006, -6);
    film.visible = false;
    scene.add(film);

    const industrialMachine = new THREE.Group();
    industrialMachine.visible = false;
    scene.add(industrialMachine);

    const factoryFrameMaterial = new THREE.MeshStandardMaterial({
      color: 0xc3c5c2, metalness: 0.58, roughness: 0.3
    });
    const safetyBlue = new THREE.MeshStandardMaterial({
      color: 0x07569a, metalness: 0.48, roughness: 0.28
    });
    const safetyYellow = new THREE.MeshStandardMaterial({
      color: 0xf0b521, metalness: 0.18, roughness: 0.44
    });
    const cabinetMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8d8d2, metalness: 0.2, roughness: 0.48
    });
    const operatorSkin = new THREE.MeshStandardMaterial({ color: 0xc9875b, roughness: 0.78 });
    const operatorNavy = new THREE.MeshStandardMaterial({ color: 0x263e56, roughness: 0.68 });
    const operatorOrange = new THREE.MeshStandardMaterial({ color: 0xf07824, roughness: 0.62 });
    const operatorLime = new THREE.MeshStandardMaterial({ color: 0xd7e64b, roughness: 0.62 });
    const operatorHelmet = new THREE.MeshStandardMaterial({
      color: 0xf4c928, metalness: 0.06, roughness: 0.36
    });
    const operatorBoots = new THREE.MeshStandardMaterial({ color: 0x24292d, roughness: 0.72 });
    const woundFilmMaterial = new THREE.MeshStandardMaterial({
      color: 0x58b8cc, metalness: 0.08, roughness: 0.3
    });

    function factoryBox(size, position, material = factoryFrameMaterial) {
      const box = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
      box.position.set(...position);
      box.castShadow = true;
      box.receiveShadow = true;
      industrialMachine.add(box);
      return box;
    }

    function factoryPipeBetween(start, end, radius, material) {
      const startPoint = new THREE.Vector3(...start);
      const endPoint = new THREE.Vector3(...end);
      const direction = endPoint.clone().sub(startPoint);
      const pipe = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, direction.length(), 16), material
      );
      pipe.position.copy(startPoint).add(endPoint).multiplyScalar(0.5);
      pipe.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      pipe.castShadow = true;
      pipe.receiveShadow = true;
      industrialMachine.add(pipe);
      return pipe;
    }

    function factoryAxialRoller(radius, length, position, material, segments = 64) {
      const roller = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, segments), material
      );
      roller.rotation.z = Math.PI / 2;
      roller.position.set(...position);
      roller.castShadow = true;
      roller.receiveShadow = true;
      industrialMachine.add(roller);
      return roller;
    }

    function factoryDrivenRoller(radius, length, position, material) {
      const drive = new THREE.Group();
      drive.position.set(...position);
      industrialMachine.add(drive);
      const roller = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, 64), material
      );
      roller.rotation.z = Math.PI / 2;
      roller.castShadow = true;
      roller.receiveShadow = true;
      drive.add(roller);
      return drive;
    }

    const frameXMin = -6.5;
    const frameXMax = 5.8;
    const frameCenterX = (frameXMin + frameXMax) / 2;
    const frameWidth = frameXMax - frameXMin;
    const frameSideZ = 2.1;
    const frameBottomY = -2.1;
    const frameTopY = 6.15;
    const frameHeight = frameTopY - frameBottomY;
    const frameCenterY = (frameTopY + frameBottomY) / 2;
    for (const x of [frameXMin, frameXMax]) {
      for (const z of [-frameSideZ, frameSideZ]) {
        factoryBox([0.24, frameHeight, 0.24], [x, frameCenterY, z]);
      }
      factoryBox([0.22, 0.22, frameSideZ * 2], [x, frameBottomY, 0]);
      factoryBox([0.18, 0.18, frameSideZ * 2], [x, 3.05, 0], safetyBlue);
      factoryBox([0.18, 0.18, frameSideZ * 2], [x, frameTopY, 0], safetyBlue);
    }
    for (const z of [-frameSideZ, frameSideZ]) {
      factoryBox([frameWidth, 0.22, 0.22], [frameCenterX, frameBottomY, z]);
      factoryBox([frameWidth, 0.16, 0.16], [frameCenterX, 5.15, z], safetyBlue);
      factoryBox([frameWidth, 0.16, 0.16], [frameCenterX, frameTopY, z], safetyBlue);
      factoryPipeBetween([frameXMin, 5.62, z], [frameXMax, 5.62, z], 0.055, safetyBlue);
      for (let x = frameXMin + 1.4; x < frameXMax; x += 2.4) {
        factoryPipeBetween([x, 5.15, z], [x, frameTopY, z], 0.035, safetyBlue);
      }
      factoryPipeBetween(
        [frameXMin, frameBottomY + 0.2, z],
        [frameXMin + 3.2, 2.75, z],
        0.065,
        factoryFrameMaterial
      );
      factoryPipeBetween(
        [frameXMax, frameBottomY + 0.2, z],
        [frameXMax - 3.2, 2.75, z],
        0.065,
        factoryFrameMaterial
      );
    }
    factoryBox([frameWidth, 0.16, frameSideZ * 1.8], [frameCenterX, 2.78, 0]);
    for (const z of [-frameSideZ + 0.14, frameSideZ - 0.14]) {
      factoryBox([frameWidth - 0.5, 0.035, 0.045], [frameCenterX, 2.89, z], safetyYellow);
    }

    const stairAngle = 0.36;
    const stairBottom = { x: 6.15, y: -1.9 };
    const stairTop = { x: 4.45, y: 2.68 };
    const stairLength = Math.hypot(stairTop.x - stairBottom.x, stairTop.y - stairBottom.y);
    const stairCenter = {
      x: (stairTop.x + stairBottom.x) / 2,
      y: (stairTop.y + stairBottom.y) / 2
    };
    for (const z of [2.35, 3.2]) {
      const stringer = factoryBox(
        [0.15, stairLength, 0.15], [stairCenter.x, stairCenter.y, z], safetyBlue
      );
      stringer.rotation.z = stairAngle;
      factoryPipeBetween(
        [stairBottom.x - 0.18, stairBottom.y + 1.05, z],
        [stairTop.x - 0.18, stairTop.y + 1.05, z],
        0.06,
        safetyBlue
      );
      for (let post = 0; post <= 4; post++) {

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = Math.min((now - previousFrame) / 1000, 0.05);
      previousFrame = now;
      const t = (now - startTime) / 1000;

      if (t < 1.2) {
        status.textContent = 'Montando el rodillo base sin anillo ni camisa…';
      } else if (t < 3.7) {
        const p = (t - 1.2) / 2.5;
        const eased = p * p * (3 - 2 * p);
        ring.visible = true;
        ring.position.x = 0;
        ring.position.y = THREE.MathUtils.lerp(ringStartY, ringCenterY, eased);
        status.textContent = 'Insertando el anillo azul en el eje…';
      } else if (t < 6.2) {
        const p = (t - 3.7) / 2.5;
        const eased = p * p * (3 - 2 * p);
        ring.position.x = 0;
        ring.position.y = ringCenterY;
        sleeve.visible = true;
        sleeve.position.x = 0;
        sleeve.position.y = THREE.MathUtils.lerp(sleeveStartY, sleeveCenterY, eased);
        status.textContent = 'Insertando la camisa por separado…';
      } else if (t < 8.7) {
        sleeve.position.y = sleeveCenterY;
        pressureRoller.visible = true;
        const p = (t - 6.2) / 2.5;
        const eased = p * p * (3 - 2 * p);
        pressureRoller.position.z = THREE.MathUtils.lerp(2.4, 0, eased);
        status.textContent = 'Colocando el rodillo de presión debajo…';
      } else if (t < 10.7) {
        pressureRoller.position.z = 0;
        film.visible = true;
        const p = (t - 8.7) / 2;
        const eased = p * p * (3 - 2 * p);
        film.position.z = THREE.MathUtils.lerp(-6, 0, eased);
        status.textContent = 'Enhebrando la película entre los rodillos…';
      } else if (t < 12.7) {
        film.position.z = 0;
        bearingSystem.visible = true;
        const p = (t - 10.7) / 2;
        const eased = p * p * (3 - 2 * p);
        bearingSystem.position.z = THREE.MathUtils.lerp(2.2, 0, eased);
        status.textContent = 'Montando rodamientos y soportes en los ejes…';
      } else if (t < 14.7) {
        bearingSystem.position.z = 0;
        driveSystem.visible = true;
        const p = (t - 12.7) / 2;
        const eased = p * p * (3 - 2 * p);
        driveSystem.position.y = THREE.MathUtils.lerp(8.5, 6.65, eased);
        status.textContent = 'Acoplando el motor y el sistema de arranque…';
      } else {
        pressureRoller.visible = true;
        pressureRoller.position.z = 0;
        film.visible = true;
        film.position.z = 0;
        bearingSystem.visible = true;
        bearingSystem.position.z = 0;
        driveSystem.visible = true;
        driveSystem.position.y = 6.65;
        starterButton.visible = false;
        runningButton.visible = true;
        sleeve.position.x = 0;
        sleeve.position.y = sleeveCenterY;
        ring.position.x = 0;
        ring.position.y = ringCenterY;
        assembly.rotation.y = (t - 14.7) * rollerAngularSpeed;
        pressureRoller.rotation.y = -(t - 14.7) * rollerAngularSpeed;
        // El patrón avanza a la velocidad tangencial del rodillo en el punto de contacto.
        filmTexture.offset.y = (filmTexture.offset.y
          + delta * (rollerAngularSpeed * outerRadius / filmLength)) % 1;
        industrialMachine.visible = true;
        const machineRunTime = t - 14.7;
        const inflationProgress = THREE.MathUtils.clamp(machineRunTime / 4.5, 0, 1);
        const inflationEase = inflationProgress * inflationProgress * (3 - 2 * inflationProgress);
        const bubbleBreath = Math.sin(machineRunTime * 1.4) * 0.008;
        const bubbleScale = 0.78 + 0.22 * inflationEase + bubbleBreath;
        bubbleAssembly.scale.set(bubbleScale, 1, bubbleScale);
        bubblePullTop.rotation.x = machineRunTime * 0.82;
        bubblePullBottom.rotation.x = -machineRunTime * 0.82;

        if (t < 16.2) {
          status.textContent = 'Integrando el equipo de soplado y el marcado en la cima…';
        } else {
          const p = THREE.MathUtils.clamp((t - 16.2) / 3, 0, 1);
          const eased = p * p * (3 - 2 * p);
          const currentRadius = THREE.MathUtils.lerp(windingCoreRadius, windingRadius, eased);
          filmDrop.visible = true;
          filmDrop.scale.y = eased;
          filmDrop.position.y = dropTopY - dropHeight * eased / 2;
          filmDrop.position.z = windingCenterZ + currentRadius + 0.025;
          windingCoil.scale.set(1, currentRadius / windingRadius, currentRadius / windingRadius);
          windingCoil.rotation.x = -(t - 16.2) * 0.45;
          guideRoll.rotation.x = (t - 16.2) * 0.55;
          status.textContent = t < 19.2
            ? 'La burbuja se expande; la película plana baja al embobinador…'
            : 'Burbuja inflada: película marcada y formando el rollo.';
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
